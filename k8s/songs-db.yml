apiVersion: v1
kind: Service
metadata:
  name: songs-db
  namespace: k8s-learning
spec:
  type: ClusterIP
  selector:
    app: songs-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: songs-db
  namespace: k8s-learning
spec:
  serviceName: songs-db
  selector:
    matchLabels:
      app: songs-db
  replicas: 1
  template:
    metadata:
      labels:
        app: songs-db # = selector.matchLabels
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "postgres"
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: songs-db
  volumeClaimTemplates:
    - metadata:
        name: songs-db
      spec:
        storageClassName: standard #default class in minikube (task says "hostpath" — Docker Desktop name)
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
