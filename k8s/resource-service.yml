apiVersion: v1
kind: Service
metadata:
  name: resource-service
  namespace: k8s-learning
spec:
  type: NodePort
  selector:
    app: resources-ms
  ports:
    - port: 8080
      nodePort: 30000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-service
  namespace: k8s-learning
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resources-ms
  template:
    metadata:
      labels:
        app: resources-ms
    spec:
      containers:
        - name: resources-container
          image: resources-image:1.0.0
          env:
            - name: RESOURCES_MS_NAME
              valueFrom:
                configMapKeyRef:
                  name: application-cm
                  key: resources_ms_name
            - name: RESOURCES_MS_PORT
              valueFrom:
                configMapKeyRef:
                  name: application-cm
                  key: resources_ms_port
            - name: SONGS_MS_URL
              valueFrom:
                configMapKeyRef:
                  name: application-cm
                  key: songs_ms_url
            - name: SONGS_MS_PORT
              valueFrom:
                configMapKeyRef:
                  name: application-cm
                  key: songs_ms_port
            - name: RESOURCES_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: application-cm
                  key: resources_db_url
            - name: RESOURCES_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: application-cm
                  key: resources_db_port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: resources_db_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: resources_db_password
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: application-cm
                  key: resources_db_name
          ports:
            - containerPort: 8080
