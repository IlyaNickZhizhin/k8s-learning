apiVersion: v1
kind: Service
metadata:
  name: resource-service
  namespace: k8s-learning
spec:
  type: NodePort
  selector:
    app: resources-ms
  ports:
    - port: 8080
      nodePort: 30000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-service
  namespace: k8s-learning
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resources-ms
  template:
    metadata:
      labels:
        app: resources-ms
    spec:
      containers:
        - name: resources-container
          image: resources-image:1.0.0
          env:
            - name: RESOURCES_MS_NAME
              value: "resources-ms"
            - name: RESOURCES_MS_PORT
              value: "8080"
            - name: SONGS_MS_URL
              value: "songs-service"
            - name: SONGS_MS_PORT
              value: "8081"
            - name: RESOURCES_DB_URL
              value: "resources-db"
            - name: RESOURCES_DB_PORT
              value: "5432"
          ports:
            - containerPort: 8080
