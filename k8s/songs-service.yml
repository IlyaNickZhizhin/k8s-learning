apiVersion: v1
kind: Service
metadata:
  name: songs-service
  namespace: k8s-learning
spec:
  type: NodePort
  selector:
    app: songs-ms
  ports:
    - port: 8081
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: songs-service
  namespace: k8s-learning
spec:
  replicas: 2
  selector:
    matchLabels:
      app: songs-ms
  template:
    metadata:
      labels:
        app: songs-ms
    spec:
      containers:
        - name: songs-container
          image: songs-image:1.0.0
          env:
            - name: SONGS_MS_NAME
              valueFrom:
                configMapKeyRef:
                  name: application-cm
                  key: songs_ms_name
            - name: SONGS_MS_PORT
              valueFrom:
                configMapKeyRef:
                  name: application-cm
                  key: songs_ms_port
            - name: SONGS_MS_URL
              valueFrom:
                configMapKeyRef:
                  name: application-cm
                  key: songs_ms_url
            - name: SONGS_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: application-cm
                  key: songs_db_url
            - name: SONGS_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: application-cm
                  key: songs_db_port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: songs_db_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: songs_db_password
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: application-cm
                  key: songs_db_name
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 3
            failureThreshold: 3
          ports:
            - containerPort: 8081
          volumeMounts:
            - mountPath: /storage
              name: songs-storage
      volumes:
        - name: songs-storage
          persistentVolumeClaim:
            claimName: songs-storage-claim
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: songs-storage-claim
  namespace: k8s-learning
spec:
  storageClassName: manual #required by task
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
