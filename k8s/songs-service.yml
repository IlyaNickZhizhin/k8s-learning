apiVersion: v1
kind: Service
metadata:
  name: songs-service
  namespace: k8s-learning
spec:
  type: NodePort
  selector:
    app: songs-ms
  ports:
    - port: 8081
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: songs-service
  namespace: k8s-learning
spec:
  replicas: 2
  selector:
    matchLabels:
      app: songs-ms
  template:
    metadata:
      labels:
        app: songs-ms
    spec:
      containers:
        - name: songs-container
          image: songs-image:1.0.0
          env:
            - name: SONGS_MS_NAME
              value: "songs-ms"
            - name: SONGS_MS_PORT
              value: "8081"
            - name: SONGS_MS_URL
              value: "songs-service"
            - name: SONGS_DB_URL
              value: "songs-db"
            - name: SONGS_DB_PORT
              value: "5432"
          ports:
            - containerPort: 8081
          volumeMounts:
            - mountPath: /storage
              name: songs-storage
      volumes:
        - name: songs-storage
          persistentVolumeClaim:
            claimName: songs-storage-claim
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: songs-storage-claim
  namespace: k8s-learning
spec:
  storageClassName: manual #required by task
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
