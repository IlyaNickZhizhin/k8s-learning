apiVersion: v1
kind: Service
metadata:
  name: resources-db
  namespace: k8s-learning
spec:
  type: ClusterIP
  selector:
    app: resources-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: resources-db
  namespace: k8s-learning
spec:
  serviceName: resources-db
  selector:
    matchLabels:
      app: resources-db
  replicas: 1
  template:
    metadata:
      labels:
        app: resources-db # = selector.matchLabels
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: resources_db_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: resources_db_password
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: application-cm
                  key: resources_db_name
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -c 'SELECT 1'"]
            periodSeconds: 3
            failureThreshold: 3
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: resources-db
  volumeClaimTemplates:
    - metadata:
        name: resources-db
      spec:
        storageClassName: standard #default class in minikube (task says "hostpath" — Docker Desktop name)
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
